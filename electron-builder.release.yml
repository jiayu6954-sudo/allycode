appId: com.allycode.desktop
productName: AllyCode
forceCodeSigning: true
directories:
  output: release/alpha.11
files:
  - dist-desktop/**/*
  - dist/**/*
  - package.json
  - node_modules/**/*
extraResources:
  - from: skill/sources-to-excel-complete/sources-to-excel
    to: skills/sources-to-excel
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/.venv/**"
  - from: .release/update-sources.json
    to: update-sources.json
  - from: benchmarks/projects/binary-market-protocol-challenge
    to: benchmarks/projects/binary-market-protocol-challenge
    filter:
      - "**/*"
      - "!.challenge-results/**/*"
      - "!.allycode-eval/**/*"
win:
  icon: desktop/assets/icon.png
  forceCodeSigning: true
  signingHashAlgorithms:
    - sha256
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AllyCode
artifactName: "${productName}-${version}-${arch}-${target}.${ext}"
publish:
  provider: generic
  url: "${env.ALLYCODE_PRIMARY_UPDATE_URL}"
