name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=dev --ignore-scripts

      - name: Type check
        run: npm run typecheck

      - name: Desktop type check
        run: npm run typecheck:desktop

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Build all targets
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev
