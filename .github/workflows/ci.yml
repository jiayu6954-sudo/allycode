name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Quality gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=dev --ignore-scripts

      - name: Install document regression dependencies
        run: python -m pip install -r skill/sources-to-excel-complete/sources-to-excel/linux-requirements.txt

      - name: Install Linux office and OCR engines
        if: runner.os == 'Linux'
        run: sudo /bin/sh skill/sources-to-excel-complete/sources-to-excel/scripts/linux-components.sh

      - name: Install modern formula engine (Linux)
        if: runner.os == 'Linux'
        run: npx tsx scripts/setup-formula-tests.ts

      - name: Install verified local formula engine (Windows)
        if: runner.os == 'Windows'
        run: npx tsx scripts/setup-formula-tests.ts

      - name: Type check
        run: npm run typecheck

      - name: Desktop type check
        run: npm run typecheck:desktop

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Build all targets
        run: npm run build

      - name: Build Linux installable packages
        if: runner.os == 'Linux'
        run: npx electron-builder --linux deb AppImage --x64 --publish never --config.directories.output=release/linux

      - name: Keep Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: allycode-linux-x64
          path: |
            release/linux/*.deb
            release/linux/*.AppImage

  security:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci --include=dev --ignore-scripts
      - run: npm audit --omit=dev
