name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Quality gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      ALLYCODE_DOCUMENT_HOME: ${{ github.workspace }}/.tmp/ci-documents

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=dev --ignore-scripts

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install document regression dependencies
        run: python -m pip install -r skill/sources-to-excel-complete/sources-to-excel/linux-requirements.txt

      - name: Install Linux office and OCR engines
        if: runner.os == 'Linux'
        run: sudo /bin/sh skill/sources-to-excel-complete/sources-to-excel/scripts/linux-components.sh

      - name: Install modern formula engine (Linux)
        if: runner.os == 'Linux'
        run: npx tsx scripts/setup-formula-tests.ts

      - name: Download pinned Windows formula engine from HTTPS mirror
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:ALLYCODE_DOCUMENT_HOME 'downloads/LibreOffice_26.2.6_Win_x86-64.msi'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $archive) | Out-Null
          curl.exe --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --connect-timeout 30 --max-time 600 --retry 2 --output $archive 'https://mirrors.ibiblio.org/libreoffice/stable/26.2.6/win/x86_64/LibreOffice_26.2.6_Win_x86-64.msi'
          if ($LASTEXITCODE -ne 0) { throw 'Pinned formula engine download failed' }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'f9877032fd908beb9c0ddf06df4af5c2e85f419c42e14876c4cce5aae5fb2660') { throw 'Formula engine SHA256 mismatch' }

      - name: Install verified local formula engine (Windows)
        if: runner.os == 'Windows'
        run: npx tsx scripts/setup-formula-tests.ts

      - name: Type check
        run: npm run typecheck

      - name: Desktop type check
        run: npm run typecheck:desktop

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Build all targets
        run: npm run build

      - name: Build Linux installable packages
        if: runner.os == 'Linux'
        run: npx electron-builder --linux deb AppImage --x64 --publish never --config.directories.output=release/linux

      - name: Keep Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: allycode-linux-x64
          path: |
            release/linux/*.deb
            release/linux/*.AppImage

  security:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci --include=dev --ignore-scripts
      - run: npm audit --omit=dev
